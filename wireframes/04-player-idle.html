<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Idle — Wheel of Bad Decisions</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Nunito', sans-serif; background: #9CA3AF; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .fredoka { font-family: 'Fredoka One', cursive; }
  .phone { background: #FFF9E6; width: 390px; min-height: 844px; border-radius: 40px; border: 6px solid #1F2937; box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; }
  .phone-bar { height: 32px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 0.7rem; font-weight: 800; color: #374151; border-bottom: 1px solid #E5E7EB; flex-shrink: 0; }
  header { background: white; border-bottom: 3px solid black; padding: 12px 20px; display: flex; align-items: center; justify-between; flex-shrink: 0; }
  .card { background: white; border: 3px solid black; border-radius: 14px; box-shadow: 4px 4px 0 black; }
  .powerup-btn { font-family: 'Fredoka One', cursive; border: 3px solid black; border-radius: 10px; box-shadow: 3px 3px 0 black; cursor: pointer; padding: 12px 8px; font-size: 0.9rem; text-align: center; background: white; flex: 1; transition: all 0.1s; }
  .powerup-btn:hover { transform: translate(1px,1px); box-shadow: 2px 2px 0 black; }
  .powerup-btn.used { background: #E5E7EB; color: #9CA3AF; border-color: #D1D5DB; box-shadow: none; text-decoration: line-through; }
  .big-time { font-family: 'Fredoka One', cursive; font-size: 5rem; line-height: 1; color: #1F2937; text-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
  .progress-wrap { height: 12px; background: #E5E7EB; border-radius: 999px; overflow: hidden; border: 2px solid black; }
  .progress-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #22C55E, #4ADE80); transition: width 1s linear; }
  .nav-links { display: flex; gap: 8px; margin-top: auto; padding: 12px 20px; border-top: 2px solid #E5E7EB; flex-shrink: 0; }
  .nav-link { flex: 1; text-align: center; font-family: 'Fredoka One', cursive; font-size: 0.8rem; padding: 8px; border: 2px solid black; border-radius: 8px; cursor: pointer; background: white; box-shadow: 2px 2px 0 black; }
  .last-spin { background: #F9FAFB; border: 2px solid #E5E7EB; border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; font-weight: 700; color: #6B7280; }
</style>
</head>
<body>
<div class="phone">
  <!-- Status bar -->
  <div class="phone-bar">
    <span>9:41</span>
    <span>● ● ●</span>
    <span>📶 🔋</span>
  </div>

  <!-- Header -->
  <div style="background:white;border-bottom:3px solid black;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
    <div>
      <div class="fredoka" style="font-size:1.1rem">🎡 Wheel of Bad Decisions</div>
      <div style="font-size:0.75rem;font-weight:700;color:#6B7280">Hi, Christian! · Room ABC123</div>
    </div>
    <div style="background:#FBBF24;border:2px solid black;border-radius:8px;padding:4px 10px;font-family:'Fredoka One',cursive;font-size:0.85rem;box-shadow:2px 2px 0 black">ABC123</div>
  </div>

  <!-- Body -->
  <div style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px">

    <!-- Countdown card -->
    <div class="card" style="padding:24px;text-align:center">
      <div style="font-weight:800;color:#6B7280;font-size:0.85rem;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px">Next spin in</div>
      <div class="big-time" id="timer">29:47</div>
      <div style="margin-top:16px">
        <div class="progress-wrap">
          <div class="progress-bar" id="pbar" style="width:99%"></div>
        </div>
      </div>
      <div style="margin-top:8px;font-size:0.75rem;font-weight:700;color:#9CA3AF">Spin #3 of the night · 30 min interval</div>
    </div>

    <!-- Power-ups -->
    <div class="card" style="padding:16px">
      <div class="fredoka" style="font-size:1.1rem;margin-bottom:12px">Your power-ups</div>
      <div style="display:flex;gap:8px">
        <button class="powerup-btn" onclick="usePowerup(this,'⚔️')">
          <div style="font-size:1.5rem;margin-bottom:4px">🗡️</div>
          Revenge<br><small>Redirect spin</small>
        </button>
        <button class="powerup-btn" onclick="usePowerup(this,'🛡️')">
          <div style="font-size:1.5rem;margin-bottom:4px">🛡️</div>
          Safe Card<br><small>Skip a spin</small>
        </button>
        <button class="powerup-btn" onclick="usePowerup(this,'🎲')">
          <div style="font-size:1.5rem;margin-bottom:4px">🎲</div>
          Double Down<br><small>50/50 gamble</small>
        </button>
      </div>
    </div>

    <!-- Last spin -->
    <div>
      <div style="font-weight:800;font-size:0.75rem;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Last spin</div>
      <div class="last-spin">
        <span style="color:#EF4444;font-family:'Fredoka One',cursive">Alex</span> got <span style="color:#A855F7;font-family:'Fredoka One',cursive">DARE</span> — bark like a dog ✅
      </div>
    </div>

    <!-- Players online -->
    <div class="card" style="padding:14px">
      <div class="fredoka" style="font-size:0.95rem;margin-bottom:8px">👥 In this game</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <span style="background:#FEF3C7;border:2px solid black;border-radius:999px;padding:4px 12px;font-size:0.8rem;font-weight:700">👑 Christian</span>
        <span style="background:#DBEAFE;border:2px solid black;border-radius:999px;padding:4px 12px;font-size:0.8rem;font-weight:700">🟢 Alex</span>
        <span style="background:#FEF9C3;border:2px solid #D1D5DB;border-radius:999px;padding:4px 12px;font-size:0.8rem;font-weight:700;color:#9CA3AF">🟡 Jo (away)</span>
        <span style="background:#D1FAE5;border:2px solid black;border-radius:999px;padding:4px 12px;font-size:0.8rem;font-weight:700">🟢 Maria</span>
      </div>
    </div>

  </div>

  <!-- Bottom nav -->
  <div class="nav-links">
    <div class="nav-link" onclick="window.location.href='05-player-selected.html'" style="background:#EF4444;color:white">🔥 Demo: Get Selected</div>
    <div class="nav-link" onclick="window.location.href='06-player-voting.html'">🗳️ Demo: Vote</div>
  </div>
</div>

<script>
let secs = 29 * 60 + 47;
function tick() {
  secs--;
  if (secs < 0) secs = 30 * 60;
  const m = String(Math.floor(secs / 60)).padStart(2,'0');
  const s = String(secs % 60).padStart(2,'0');
  document.getElementById('timer').textContent = `${m}:${s}`;
  const pct = (secs / (30 * 60)) * 100;
  const bar = document.getElementById('pbar');
  bar.style.width = pct + '%';
  bar.style.background = pct > 50 ? 'linear-gradient(90deg,#22C55E,#4ADE80)' : pct > 20 ? 'linear-gradient(90deg,#F97316,#FBBF24)' : 'linear-gradient(90deg,#EF4444,#F97316)';
}
setInterval(tick, 1000);

function usePowerup(btn, name) {
  if (btn.classList.contains('used')) return;
  btn.classList.add('used');
}
</script>
</body>
</html>
